name: Installer Audiveris
description: Installe le paquet Ubuntu de la dernière version d'Audiveris (reconnaissance optique de partitions) et xvfb.
inputs:
  token:
    description: Jeton GitHub pour télécharger la release
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
      run: |
        asset=$(gh release view --repo Audiveris/audiveris --json assets -q '.assets[].name' \
          | grep -E 'ubuntu24.*\.deb$' | head -1)
        [ -n "$asset" ] || asset=$(gh release view --repo Audiveris/audiveris --json assets -q '.assets[].name' \
          | grep -E 'ubuntu.*x86_64.*\.deb$|\.deb$' | head -1)
        echo "Paquet : $asset"
        gh release download --repo Audiveris/audiveris --pattern "$asset" --dir "$RUNNER_TEMP"
        sudo apt-get update -q
        sudo apt-get install -y -q xvfb
        # On extrait les fichiers sans lancer les scripts d'installation du paquet : son script
        # post-installation échoue sur un serveur (xdg-desktop-menu : pas de menu « Applications »).
        sudo dpkg-deb -x "$RUNNER_TEMP/$asset" /
        bin=$(ls /opt/*/bin/[Aa]udiveris* 2>/dev/null | head -1)
        [ -n "$bin" ] || { echo "Audiveris introuvable après extraction" >&2; dpkg-deb -c "$RUNNER_TEMP/$asset" | grep -i bin/; exit 1; }
        echo "Audiveris : $bin"
        "$bin" -help >/dev/null 2>&1 || xvfb-run -a "$bin" -help | head -5 || true
