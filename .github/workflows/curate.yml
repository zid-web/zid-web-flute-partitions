# Robot de curation : cherche de nouveaux morceaux pour flûte sur IMSLP, les classe par niveau
# et ouvre une pull request à valider. Rien n'est publié sans fusion de cette pull request.
#
# Prérequis (une fois) :
#   - Settings → Secrets and variables → Actions : IMSLP_USERNAME, IMSLP_PASSWORD
#   - Settings → Actions → General : cocher « Allow GitHub Actions to create and approve pull requests »
name: Curation IMSLP
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Nouvelles œuvres examinées par catégorie IMSLP"
        default: "150"
      per_level:
        description: "Morceaux ajoutés au maximum par niveau (1 à 5)"
        default: "3"
      max_level:
        description: "Niveau maximal proposé (1 à 5)"
        default: "5"
      omr:
        description: "Reconnaître aussi les PDF de flûte seule (Audiveris)"
        type: boolean
        default: true
      max_pdf:
        description: "PDF reconnus au maximum (≈ 2 à 5 min chacun)"
        default: "8"
  schedule:
    - cron: "17 4 1 * *" # le 1er de chaque mois

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: curation-imslp
  cancel-in-progress: false

jobs:
  curate:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      CURATOR: .claude/skills/imslp-flute-curator/scripts/curate.py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Découverte des œuvres
        run: python3 -u "$CURATOR" discover --limit "${{ inputs.limit || '150' }}"
      - name: Téléchargement (MusicXML, et PDF de flûte seule pour l'OMR)
        env:
          IMSLP_USERNAME: ${{ secrets.IMSLP_USERNAME }}
          IMSLP_PASSWORD: ${{ secrets.IMSLP_PASSWORD }}
        run: >
          python3 -u "$CURATOR" fetch
          ${{ (github.event_name == 'schedule' || inputs.omr) && '--pdf' || '' }}
          --max-pdf "${{ inputs.max_pdf || '8' }}"
      - name: PDF à reconnaître ?
        id: pdfs
        run: echo "count=$(ls skill-work/raw/*.pdf 2>/dev/null | wc -l)" >> "$GITHUB_OUTPUT"
      - name: Installation d'Audiveris (reconnaissance optique)
        if: steps.pdfs.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Paquet Ubuntu de la dernière version publiée d'Audiveris (Java inclus).
          asset=$(gh release view --repo Audiveris/audiveris --json assets -q '.assets[].name' \
            | grep -E 'ubuntu24.*\.deb$' | head -1)
          [ -n "$asset" ] || asset=$(gh release view --repo Audiveris/audiveris --json assets -q '.assets[].name' \
            | grep -E 'ubuntu.*x86_64.*\.deb$|\.deb$' | head -1)
          echo "Paquet : $asset"
          gh release download --repo Audiveris/audiveris --pattern "$asset" --dir "$RUNNER_TEMP"
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb "$RUNNER_TEMP/$asset"
          ls /opt/audiveris/bin || dpkg -L "$(dpkg-deb -f "$RUNNER_TEMP/$asset" Package)" | grep -i 'bin/'
      - name: Reconnaissance des PDF (OMR)
        if: steps.pdfs.outputs.count != '0'
        run: xvfb-run -a python3 -u "$CURATOR" omr
      - name: Analyse (partie de flûte, difficulté, niveau)
        run: python3 -u "$CURATOR" analyse
      - name: Sélection
        run: >
          python3 -u "$CURATOR" publish
          --per-level "${{ inputs.per_level || '3' }}"
          --max-level "${{ inputs.max_level || '5' }}"
      - name: Tests du skill
        run: python3 -m unittest discover -s .claude/skills/imslp-flute-curator/tests
      - name: Pull request à valider
        uses: peter-evans/create-pull-request@v7
        with:
          branch: curation/imslp
          delete-branch: true
          add-paths: |
            public/scores/**
            content/imslp-seen.json
          commit-message: "Catalogue : nouveaux morceaux IMSLP"
          title: "Catalogue : nouveaux morceaux IMSLP"
          body-path: skill-work/summary.md
          labels: catalogue
      - name: Résumé
        if: always()
        run: cat skill-work/summary.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
