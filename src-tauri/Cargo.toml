[package]
name = "flute-partitions"
version = "0.1.0"
description = "Partitions de flûte interactives"
edition = "2021"

[lib]
name = "flute_partitions_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
